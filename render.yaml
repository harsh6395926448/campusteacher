# Render Blueprint for CampusSlot
services:
  - type: web
    name: campusslot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusslot-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: APPOINTMENT_TIMEZONE
        value: Asia/Kolkata
databases:
  - name: campusslot-db
    databaseName: campusslot
    user: campusslot_user
    plan: free
